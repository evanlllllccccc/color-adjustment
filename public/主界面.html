<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 主页面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("1.jpg") no-repeat center center fixed;
            background-size: cover;
            background-color: #f8f3e9;
            padding: 20px;
        }

        header {
            background: rgba(255, 250, 240, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e6d5c3;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8c5c3b;
        }

        .nav-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

            .nav-right a {
                color: #8c5c3b;
                text-decoration: none;
                transition: color 0.3s;
                padding: 5px 10px;
                border-radius: 4px;
                cursor: pointer;
            }

                .nav-right a:hover {
                    color: #b17a54;
                    background: #f0e6d6;
                }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 250, 240, 0.9);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .title-section {
            text-align: center;
            margin-bottom: 40px;
        }

            .title-section h1 {
                font-size: 36px;
                color: #5a3c2c;
                margin-bottom: 10px;
            }

            .title-section p {
                font-size: 20px;
                color: #7a513c;
            }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: #fff;
            border: 1px solid #e6d5c3;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: inherit;
        }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 20px rgba(139, 90, 43, 0.15);
                background: #fffaf5;
            }

            .card h3 {
                font-size: 20px;
                color: #8c5c3b;
                margin-bottom: 15px;
                padding-bottom: 8px;
                border-bottom: 2px solid #f0e6d6;
            }

            .card p {
                color: #7a513c;
                line-height: 1.6;
            }

        .login-tip {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e6d5c3;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #7a513c;
        }

        @media (max-width: 768px) {
            .title-section h1 {
                font-size: 28px;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">传统色彩数字工坊</div>
        <div class="nav-right" id="userNav">
            <a href="login.html">个人中心</a>
        </div>
    </header>

    <div class="container">
        <div class="title-section">
            <h1>传统色彩数字工坊</h1>
            <p>探寻东方色彩之美</p>
        </div>

        <div class="card-grid">
            <a href="rank.html" class="card">
                <h3>🏆 排行榜</h3>
                <p>实时查看用户排名，根据作品点赞数和浏览量综合排序，发现优秀创作者。</p>
            </a>

            <a href="染色界面.html" class="card">
                <h3>🎨 染色工坊</h3>
                <p>在线调试色彩参数，模拟植物染、矿物染等传统工艺效果，预览不同材质上的色彩呈现。</p>
            </a>

            <a href="gallery.html" class="card">
                <h3>🖼️ 作品库</h3>
                <p>浏览所有用户的公开作品，点赞、评论、交流，发现传统色彩的无限可能。</p>
            </a>

            <a href="介绍界面.html" class="card">
                <h3>📖 项目介绍</h3>
                <p>了解传统色彩数字工坊的项目背景、技术实现和文化传承意义。</p>
            </a>
        </div>

        <div class="login-tip" id="loginTip">
            加载中...
        </div>
    </div>

    <script>
        (function () {
            // 后端基础地址
            const API_BASE = ' ';

            // 获取存储的 token
            const authToken = localStorage.getItem('authToken');

            // 登出函数
            window.logout = function () {
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                // 可选：调用后端登出接口
                fetch(`${API_BASE}/api/auth/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }).catch(() => { }).finally(() => {
                    window.location.href = 'login.html';
                });
            };

            // 初始化界面
            async function initMainPage() {
                const loginTip = document.getElementById('loginTip');
                const userNav = document.getElementById('userNav');

                if (!authToken) {
                    // 游客模式
                    loginTip.innerText = '👤 当前为游客模式，可体验染色工坊，部分功能需登录';
                    userNav.innerHTML = `
                            <a href="介绍界面.html">项目介绍</a>
                            <a href="index.html">登录/注册</a>
                        `;
                    return;
                }

                // 有 token，尝试获取用户信息
                try {
                    const response = await fetch(`${API_BASE}/api/users/me`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });

                    if (!response.ok) {
                        // token 无效或过期
                        throw new Error('Token 无效');
                    }

                    const data = await response.json();
                    const user = data.user || data;

                    // 更新提示和导航
                    loginTip.innerText = `👋 欢迎回来，${user.account || user.username}！`;
                    userNav.innerHTML = `
                            <a href="介绍界面.html">项目介绍</a>
                            <a href="login.html">个人中心</a>
                            <a href="#" onclick="logout()">退出登录</a>
                        `;

                    // 可选：将用户信息暂存到 localStorage 供其他页面快速读取（但始终以后端为准）
                    localStorage.setItem('currentUser', JSON.stringify(user));

                } catch (error) {
                    console.warn('获取用户信息失败，视为游客模式', error);
                    // 清除无效 token
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    loginTip.innerText = '👤 当前为游客模式，可体验染色工坊，部分功能需登录';
                    userNav.innerHTML = `
                            <a href="介绍界面.html">项目介绍</a>
                            <a href="index.html">登录/注册</a>
                        `;
                }
            }

            // 页面加载时执行
            window.onload = initMainPage;
        })();
    </script>
    <!-- 如果不需要 AI 聊天，可以删除下面的引用，此处保留但不会影响主界面功能 -->
    <!-- <script src="ai-chat.js"></script> -->
</body>
</html>
