<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei",sans-serif;
        }

        body {
            background: #f7f3ee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fffaf5;
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d9b798;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-size: 26px;
            color: #8c5c3b;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .sub-title {
            text-align: center;
            color: #a87f61;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
        }

            .input-group label {
                display: block;
                color: #7a513c;
                font-size: 14px;
                margin-bottom: 6px;
            }

            .input-group input {
                width: 100%;
                height: 44px;
                padding: 0 14px;
                border: 1px solid #d9b798;
                border-radius: 8px;
                background: #fff;
                font-size: 15px;
                outline: none;
            }

        .btn {
            width: 100%;
            height: 46px;
            border-radius: 8px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-login {
            background: #b17a54;
            color: #fff;
        }

        .btn-register {
            background: transparent;
            color: #b17a54;
            border: 1px solid #b17a54;
            margin-top: 12px;
        }

        .btn-guest {
            background: #86987c;
            color: #fff;
            margin-top: 12px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

            .modal.show {
                display: flex;
            }

        .modal-card {
            background: #fffaf5;
            width: 90%;
            max-width: 380px;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #d4b2a2;
        }

        .modal-title {
            text-align: center;
            font-size: 22px;
            color: #8c5c3b;
            margin-bottom: 25px;
        }

        .close-modal {
            text-align: right;
            color: #8c5c3b;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title">传统色彩数字工坊</div>
        <div class="sub-title">Traditional Color Workshop</div>

        <div class="input-group">
            <label>账号</label>
            <input type="text" id="loginAccount" placeholder="请输入账号">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="loginPwd" placeholder="请输入密码">
        </div>

        <button class="btn btn-login" onclick="handleLogin()">登录</button>
        <button class="btn btn-register" onclick="showRegister()">注册账号</button>
        <button class="btn btn-guest" onclick="goGuest()">游客进入</button>
        <!-- 删除了多余的 #btnRegister 按钮 -->
    </div>

    <div class="modal" id="regModal">
        <div class="modal-card">
            <div class="close-modal" onclick="hideRegister()">关闭 ×</div>
            <div class="modal-title">账号注册</div>
            <div class="input-group">
                <label>账号</label>
                <input type="text" id="regAccount" placeholder="请输入账号">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="regPwd" placeholder="请输入密码">
            </div>
            <button class="btn btn-login" onclick="doRegister()">完成注册</button>
        </div>
    </div>

    <script>
        // API 地址
        const API = 'https://color-adjustment-production.up.railway.app';

        // ========== 注册弹窗控制 ==========
        function showRegister() {
            document.getElementById("regModal").classList.add("show");
        }

        function hideRegister() {
            document.getElementById("regModal").classList.remove("show");
        }

        // ========== 注册 ==========
        async function doRegister() {
            const account = document.getElementById("regAccount").value.trim();
            const pwd = document.getElementById("regPwd").value.trim();

            if (!account || !pwd) {
                alert("请填写账号和密码");
                return;
            }

            console.log('准备注册:', { account, API });

            try {
                const res = await fetch(API + "/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: account, password: pwd })
                });

                console.log('响应状态:', res.status);

                const result = await res.json();
                console.log('响应结果:', result);

                if (result.success) {
                    alert("注册成功！请登录");
                    hideRegister();
                    document.getElementById("regAccount").value = '';
                    document.getElementById("regPwd").value = '';
                } else {
                    alert(result.msg || "注册失败，账号可能已存在");
                }
            } catch (e) {
                console.error('注册错误:', e);
                alert("注册失败: " + e.message);
            }
        }

        // ========== 登录 ==========
        async function handleLogin() {
            const username = document.getElementById("loginAccount").value.trim();
            const password = document.getElementById("loginPwd").value;

            if (!username || !password) {
                alert("请输入账号和密码");
                return;
            }

            try {
                const res = await fetch(API + "/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem("currentUser", JSON.stringify(data.user));
                    if (data.user.role === "admin") {
                        window.location.href = "管理员界面.html";
                    } else {
                        window.location.href = "主界面.html";
                    }
                } else {
                    alert(data.msg || "登录失败");
                }
            } catch (err) {
                alert("网络错误，请稍后重试");
            }
        }

        // ========== 游客进入 ==========
        async function goGuest() {
            try {
                const res = await fetch(API + "/api/guest", { method: "POST" });
                const result = await res.json();

                if (result.success) {
                    localStorage.setItem("currentUser", JSON.stringify({ userId: 0, username: "游客" }));
                    location.href = "游客界面.html";
                }
            } catch (e) {
                alert("网络错误，无法进入游客模式");
            }
        }
    </script>
</body>
</html>
