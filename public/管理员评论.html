<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>评论监管 - 传统色彩数字工坊</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei",sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255,250,245,0.95);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
        }

        .header-btn {
            background: #b17a54;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
        }

        .main {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 260px;
            background: rgba(255,250,245,0.93);
            padding: 30px 0;
            border-right: 1px solid #d4b2a2;
        }

        .nav-item {
            display: block;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

            .nav-item:hover, .nav-item.active {
                background: rgba(177,122,84,0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .card {
            background: rgba(255,250,245,0.95);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fffaf5;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #e2c9b8;
        }

        .stat-num {
            font-size: 24px;
            font-weight: bold;
            color: #b17a54;
        }

        .comment-item {
            background: #fffaf5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e2c9b8;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .comment-content {
            flex: 1;
        }

        .comment-header {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .comment-user {
            font-weight: bold;
            color: #8c5c3b;
        }

        .comment-work {
            background: #f0e6d6;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            color: #b17a54;
        }

        .comment-text {
            color: #7a513c;
            margin-bottom: 8px;
        }

        .comment-time {
            font-size: 12px;
            color: #a87f61;
        }

        .btn-delete {
            background: #c95a5a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh-btn {
            background: #b17a54;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">评论监管</div>
        <button class="header-btn" onclick="logout()">退出登录</button>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="nav-item" onclick="goTo('管理员主界面.html')">🏠 首页</div>
            <div class="nav-item" onclick="goTo('管理员统计.html')">📊 数据统计</div>
            <div class="nav-item active" onclick="goTo('管理员评论.html')">💬 评论监管</div>
            <div class="nav-item" onclick="goTo('管理员素材.html')">🖼️ 素材管理</div>
            <div class="nav-item" onclick="goTo('管理员作品库.html')">🎨 用户作品库</div>
            <div class="nav-item" onclick="goTo('管理员排行榜.html')">🏆 热度排行</div>
        </div>
        <div class="content">
            <div class="card">
                <div class="title">💬 全站评论监管</div>
                <div class="stats">
                    <div class="stat"><span class="stat-num" id="totalComments">0</span> 总评论</div>
                    <div class="stat"><span class="stat-num" id="todayComments">0</span> 今日新增</div>
                </div>
                <button class="refresh-btn" onclick="loadComments()">🔄 刷新</button>
                <div id="commentsList">加载中...</div>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = 'https://color-adjustment-production.up.railway.app';
        function goTo(p) { location.href = p; }
        function logout() { localStorage.removeItem('currentUser'); location.href = 'index.html'; }

        (function () {
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user || user.role !== 'admin') { alert('无权限'); location.href = 'index.html'; }
        })();

        let allComments = [];

        async function loadComments() {
            try {
                const res = await fetch(`${API_BASE}/api/comments`);
                const data = await res.json();
                allComments = data || [];
                document.getElementById('totalComments').innerText = allComments.length;
                const today = new Date().toDateString();
                const todayCnt = allComments.filter(c => new Date(c.createTime).toDateString() === today).length;
                document.getElementById('todayComments').innerText = todayCnt;
                render();
            } catch (e) { document.getElementById('commentsList').innerHTML = '<div class="empty">加载失败</div>'; }
        }

        function render() {
            const list = document.getElementById('commentsList');
            if (!allComments.length) { list.innerHTML = '<div style="text-align:center;padding:40px;color:#a87f61;">暂无评论</div>'; return; }
            const sorted = [...allComments].sort((a, b) => new Date(b.createTime) - new Date(a.createTime));
            list.innerHTML = sorted.map(c => `
                <div class="comment-item">
                    <div class="comment-content">
                        <div class="comment-header">
                            <span class="comment-user">${escapeHtml(c.username)}</span>
                            <span class="comment-work">素材ID: ${c.imageId}</span>
                        </div>
                        <div class="comment-text">${escapeHtml(c.content)}</div>
                        <div class="comment-time">${new Date(c.createTime).toLocaleString()}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteComment(${c.id})">删除</button>
                </div>
            `).join('');
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        window.deleteComment = async function (id) {
            if (!confirm('确定删除这条评论？')) return;
            try {
                await fetch(`${API_BASE}/api/comment/${id}`, { method: 'DELETE' });
                allComments = allComments.filter(c => c.id !== id);
                render();
                document.getElementById('totalComments').innerText = allComments.length;
            } catch (e) { alert('删除失败'); }
        };

        window.onload = loadComments;
    </script>
</body>
</html>
