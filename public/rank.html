    <script>
        // 后端API地址
        // 改成你的后端地址
        const API = 'https://color-adjustment-production.up.railway.app';

        let currentTab = 'all';
        let allWorks = [];
        let aiScorer = null;

        window.onload = async function () {
            console.log("=== 作品排行榜已加载 ===");
            aiScorer = new AIScorer();

            // 检查颜色库是否加载成功
            const libInfo = aiScorer.getLibraryInfo();
            console.log("颜色库状态:", libInfo);

            await loadRankings();
            // 每30秒刷新一次
            setInterval(loadRankings, 30000);
        };

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            loadRankings();
        }

        async function loadRankings() {
            try {
                // 从后端API获取所有作品
                const response = await fetch(`${API}/api/works/public`);
                if (!response.ok) throw new Error('获取作品失败');

                const works = await response.json();
                console.log('从后端获取作品:', works.length);

                allWorks = [];

                // 处理每个作品
                works.forEach((work) => {
                    // 获取或计算AI评分
                    const aiScore = getOrCalculateAIScore(work);

                    // 时间过滤
                    let includeWork = true;
                    const workDate = new Date(work.created_at || work.time || Date.now());

                    if (currentTab === 'week') {
                        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
                        includeWork = workDate > weekAgo;
                    } else if (currentTab === 'month') {
                        const monthAgo = new Date();
                        monthAgo.setMonth(monthAgo.getMonth() - 1);
                        includeWork = workDate > monthAgo;
                    }

                    if (includeWork) {
                        allWorks.push({
                            ...work,
                            img: work.colors || work.img || '', 
                            account: work.author || work.user_id,
                            authorAvatar: work.author_avatar || `https://picsum.photos/200/200?random=${work.id}`,
                            aiScore: aiScore,
                            totalScore: calculateTotalScore(work, aiScore)
                        });
                    }
                });

                // 根据当前标签排序
                if (currentTab === 'ai') {
                    allWorks.sort((a, b) => (b.aiScore.harmony * 0.4 + b.aiScore.innovation * 0.4 + b.aiScore.popularity * 0.2) -
                        (a.aiScore.harmony * 0.4 + a.aiScore.innovation * 0.4 + a.aiScore.popularity * 0.2));
                } else {
                    allWorks.sort((a, b) => b.totalScore - a.totalScore);
                }

                renderRankings();
                document.getElementById('updateTime').innerText = '最后更新：' + new Date().toLocaleTimeString();

            } catch (error) {
                console.error('加载排行榜失败:', error);
                // 如果后端失败，使用本地数据作为备用
                loadLocalRankings();
            }
        }

        // 备用：从本地加载
        function loadLocalRankings() {
            allWorks = [];
            const allAccounts = new Set();

            for (let key in localStorage) {
                if (key.startsWith("myWorks_")) {
                    allAccounts.add(key.replace("myWorks_", ""));
                }
            }

            allAccounts.forEach(account => {
                const works = JSON.parse(localStorage.getItem("myWorks_" + account) || "[]");
                const userDetails = JSON.parse(localStorage.getItem("userDetails_" + account) || "{}");

                works.forEach((work, idx) => {
                    const aiScore = getOrCalculateAIScore(work, account, idx);

                    let includeWork = true;
                    const workDate = new Date(work.time || Date.now());

                    if (currentTab === 'week') {
                        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
                        includeWork = workDate > weekAgo;
                    } else if (currentTab === 'month') {
                        const monthAgo = new Date();
                        monthAgo.setMonth(monthAgo.getMonth() - 1);
                        includeWork = workDate > monthAgo;
                    }

                    if (includeWork) {
                        allWorks.push({
                            ...work,
                            img: work.colors || work.img || '', 
                            account: account,
                            authorAvatar: userDetails.avatar || `https://picsum.photos/200/200?random=${account.charCodeAt(0)}`,
                            aiScore: aiScore,
                            totalScore: calculateTotalScore(work, aiScore)
                        });
                    }
                });
            });

            allWorks.sort((a, b) => b.totalScore - a.totalScore);
            renderRankings();
            document.getElementById('updateTime').innerText = '最后更新：' + new Date().toLocaleTimeString() + ' (本地模式)';
        }

        function getOrCalculateAIScore(work, account, idx) {
            // 优先使用后端返回的AI评分
            if (work.ai_score) {
                return {
                    harmony: work.ai_score.harmony || 70,
                    innovation: work.ai_score.innovation || 65,
                    popularity: work.ai_score.popularity || Math.min(100, ((work.views || 0) + (work.likes || 0) * 2) / 10),
                    comment: work.ai_score.comment || "AI评分完成",
                    timestamp: Date.now()
                };
            }

            // 本地计算
            const scoreKey = `aiScore_${account}_${work.id || idx}`;
            const stored = localStorage.getItem(scoreKey);

            if (stored) {
                return JSON.parse(stored);
            }

            return aiScorer ? aiScorer.calculateScore(work) : {
                harmony: 70,
                innovation: 65,
                popularity: Math.min(100, ((work.views || 0) + (work.likes || 0) * 2) / 10),
                comment: "等待AI深度分析...",
                timestamp: Date.now()
            };
        }

        function calculateTotalScore(work, aiScore) {
            const popularityRaw = ((work.views || 0) / 10 + (work.likes || 0) * 2);
            const popularityScore = Math.min(100, popularityRaw);

            return Math.round(
                aiScore.harmony * 0.25 +
                aiScore.innovation * 0.25 +
                popularityScore * 0.5
            );
        }

        function renderRankings() {
            const container = document.getElementById('rankContainer');

            if (allWorks.length === 0) {
                container.innerHTML = `
                        <div class="empty-box">
                            <div style="font-size:48px; margin-bottom:15px;">🎨</div>
                            暂无作品，成为第一个创作者吧！<br>
                            <a href="染色界面.html" style="color:#b17a54; text-decoration:none; margin-top:10px; display:inline-block;">去创作 →</a>
                        </div>
                    `;
                return;
            }

            let html = '<div class="rank-list">';
            allWorks.forEach((work, index) => {
                const rankClass = index < 3 ? `rank-${index + 1}` : 'rank-other';
                const medal = index < 3 ? ['🥇', '🥈', '🥉'][index] : (index + 1);
                const ai = work.aiScore;

                html += `
                        <div class="rank-item" onclick="showScoreDetail('${work.account}', '${work.id || index}')">
                            <div class="rank-num ${rankClass}">${medal}</div>
                            <img src="${work.img}" class="work-image" alt="${work.title || '未命名作品'}" onerror="this.src='https://picsum.photos/200/200?random=1'">
                            <div class="work-info">
                                <div class="work-title">${work.title || '未命名作品'}</div>
                                <div class="work-author">
                                    <img src="${work.authorAvatar}" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;">
                                    <span>${work.account}</span>
                                </div>
                                <div class="work-stats">
                                    <span class="stat-item">👁 ${work.views || 0}</span>
                                    <span class="stat-item">❤️ ${work.likes || 0}</span>
                                    <span class="stat-item">📅 ${new Date(work.created_at || work.time || Date.now()).toLocaleDateString()}</span>
                                </div>
                                <div class="ai-scores">
                                    <span class="ai-score-tag harmony">
                                        🎨 和谐度 ${ai.harmony}
                                    </span>
                                    <span class="ai-score-tag innovation">
                                        💡 创新度 ${ai.innovation}
                                    </span>
                                    <span class="ai-score-tag" style="background:#fff3e0;color:#e65100;">
                                        🔥 热度 ${Math.round(ai.popularity || 0)}
                                    </span>
                                </div>
                            </div>
                            <div class="total-score-box">
                                <div class="total-score-number">${work.totalScore}</div>
                                <div class="total-score-label">综合得分</div>
                                <div class="score-breakdown">
                                    AI:${Math.round((ai.harmony + ai.innovation) / 2)}<br>
                                    互动:${Math.round(ai.popularity || 0)}
                                </div>
                            </div>
                        </div>
                    `;
            });
            html += '</div>';

            container.innerHTML = html;
        }

        function showScoreDetail(account, workId) {
            const work = allWorks.find(w => w.account === account && (w.id || allWorks.indexOf(w).toString()) === workId);
            if (!work) return;

            const ai = work.aiScore;
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                    <div style="text-align:center;margin-bottom:20px;">
                        <img src="${work.img}" style="max-width:200px;max-height:200px;border-radius:8px;border:2px solid #e6d5c3;">
                    </div>
                    <div class="score-detail-item">
                        <span class="score-detail-label">🎨 AI和谐度评分</span>
                        <span class="score-detail-value">${ai.harmony}/100</span>
                    </div>
                    <div class="score-detail-item">
                        <span class="score-detail-label">💡 AI创新度评分</span>
                        <span class="score-detail-value">${ai.innovation}/100</span>
                    </div>
                    <div class="score-detail-item">
                        <span class="score-detail-label">🔥 受欢迎度评分</span>
                        <span class="score-detail-value">${Math.round(ai.popularity || 0)}/100</span>
                    </div>
                    <div class="score-detail-item">
                        <span class="score-detail-label">👁 浏览量</span>
                        <span class="score-detail-value">${work.views || 0}</span>
                    </div>
                    <div class="score-detail-item">
                        <span class="score-detail-label">❤️ 点赞数</span>
                        <span class="score-detail-value">${work.likes || 0}</span>
                    </div>
                    <div class="score-detail-item" style="border-top:2px solid #b17a54;margin-top:10px;padding-top:15px;">
                        <span class="score-detail-label">🏆 综合得分</span>
                        <span class="score-detail-value" style="font-size:20px;color:#b17a54;">${work.totalScore}</span>
                    </div>
                    <div class="ai-comment">
                        <strong>AI评价：</strong>${ai.comment || '暂无评价'}
                    </div>
                `;

            document.getElementById('scoreModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('scoreModal').classList.remove('active');
        }

        async function startAIScoring() {
            const overlay = document.getElementById('loadingOverlay');
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');

            overlay.classList.add('active');

            // 收集所有需要评分的作品
            const worksToScore = [];

            try {
                // 优先从后端获取作品
                const response = await fetch(`${API}/api/works/public`);
                const works = await response.json();
                console.log('排行榜原始数据:', works);  // 添加调试
                works.forEach(work => {
                    worksToScore.push({ work, id: work.id });
                });
            } catch (e) {
                // 后端失败，使用本地
                for (let key in localStorage) {
                    if (key.startsWith("myWorks_")) {
                        const account = key.replace("myWorks_", "");
                        const works = JSON.parse(localStorage.getItem(key) || "[]");
                        works.forEach((work, idx) => {
                            worksToScore.push({ work, account, idx });
                        });
                    }
                }
            }

            // 批量评分
            for (let i = 0; i < worksToScore.length; i++) {
                const { work, account, idx, id } = worksToScore[i];
                const progress = ((i + 1) / worksToScore.length) * 100;

                progressBar.style.width = progress + '%';
                loadingText.innerText = `AI正在分析作品 ${i + 1}/${worksToScore.length}: ${work.title || '未命名'}...`;

                // 调用AI评分
                const score = await aiScorer.analyzeWork(work);

                // 如果有后端ID，发送到后端保存
                if (id) {
                    try {
                        await fetch(`${API_URL}/api/works/${id}/ai-score`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                harmony: score.harmony,
                                innovation: score.innovation,
                                popularity: score.popularity,
                                comment: score.comment
                            })
                        });
                    } catch (e) {
                        console.log('后端保存失败，使用本地存储');
                    }
                }

                // 本地存储备份
                if (account !== undefined) {
                    const scoreKey = `aiScore_${account}_${work.id || idx}`;
                    localStorage.setItem(scoreKey, JSON.stringify(score));
                }

                await new Promise(r => setTimeout(r, 100));
            }

            overlay.classList.remove('active');
            loadRankings();
            alert('AI评分完成！排行榜已更新');
        }

        // 点击模态框外部关闭
        document.getElementById('scoreModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
