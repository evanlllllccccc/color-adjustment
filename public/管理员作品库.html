<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员作品库 - 传统色彩数字工坊</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255,250,245,0.95);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
        }

        .header-btn {
            background: #b17a54;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
        }

        .main {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 260px;
            background: rgba(255,250,245,0.93);
            padding: 30px 0;
            border-right: 1px solid #d4b2a2;
        }

        .nav-item {
            display: block;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

            .nav-item:hover, .nav-item.active {
                background: rgba(177,122,84,0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .card {
            background: rgba(255,250,245,0.95);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 20px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #d4b2a2;
            border-radius: 6px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #d4b2a2;
            background: white;
            border-radius: 6px;
            cursor: pointer;
        }

            .filter-btn.active {
                background: #b17a54;
                color: white;
            }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fffaf5;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #e2c9b8;
        }

        .stat-num {
            font-size: 24px;
            font-weight: bold;
            color: #b17a54;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .work-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2c9b8;
            transition: 0.3s;
        }

            .work-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            }

        .work-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            cursor: pointer;
        }

        .work-info {
            padding: 15px;
        }

        .work-title {
            font-size: 16px;
            color: #8c5c3b;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .work-author {
            font-size: 13px;
            color: #7a513c;
            margin-bottom: 8px;
        }

        .work-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #a87f61;
            margin-bottom: 10px;
        }

        .work-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-view {
            background: #b17a54;
            color: white;
        }

        .btn-delete {
            background: #c95a5a;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #a87f61;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            .modal.show {
                display: flex;
            }

        .modal-content {
            background: #fffaf5;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #d4b2a2;
        }

        .refresh-btn {
            background: #b17a54;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">管理员作品库</div>
        <button class="header-btn" onclick="logout()">退出登录</button>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="nav-item" onclick="goTo('管理员主界面.html')">🏠 首页</div>
            <div class="nav-item" onclick="goTo('管理员统计.html')">📊 数据统计</div>
            <div class="nav-item" onclick="goTo('管理员评论.html')">💬 评论监管</div>
            <div class="nav-item" onclick="goTo('管理员素材.html')">🖼️ 素材管理</div>
            <div class="nav-item active" onclick="goTo('管理员作品库.html')">🎨 用户作品库</div>
            <div class="nav-item" onclick="goTo('管理员排行榜.html')">🏆 热度排行</div>
        </div>
        <div class="content">
            <div class="card">
                <div class="title">📚 所有用户作品</div>
                <div class="stats">
                    <div class="stat"><span class="stat-num" id="totalWorks">0</span> 作品总数</div>
                    <div class="stat"><span class="stat-num" id="totalAuthors">0</span> 作者数</div>
                    <div class="stat"><span class="stat-num" id="totalLikes">0</span> 总点赞</div>
                </div>
                <div class="filter-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索作品或作者..." oninput="filterWorks()">
                    <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
                    <button class="filter-btn" onclick="setFilter('hot', this)">最热</button>
                    <button class="filter-btn" onclick="setFilter('new', this)">最新</button>
                </div>
                <button class="refresh-btn" onclick="loadWorks()">🔄 刷新数据</button>
                <div class="grid" id="worksGrid"><div class="empty">加载中...</div></div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal" id="detailModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle">作品详情</h3>
            <img src="" id="modalImg" style="width:100%; max-height:300px; object-fit:contain; border-radius:8px; margin-bottom:15px;">
            <div id="modalInfo"></div>
            <div id="modalComments"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-delete" onclick="deleteCurrentWork()">删除作品</button>
                <button class="btn" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = ' ';
        let allWorks = [], filteredWorks = [], currentFilter = 'all', currentWorkId = null;

        // 权限验证
        (function () {
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) { alert('请先登录'); location.href = 'index.html'; return; }
            if (user.role !== 'admin') { alert('无管理员权限'); location.href = '主界面.html'; return; }
        })();

        function goTo(p) { location.href = p; }
        function logout() { localStorage.removeItem('currentUser'); location.href = 'index.html'; }

        async function loadWorks() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/works`);
                const data = await res.json();
                allWorks = (data.works || data || []).map(w => ({
                    id: w.id, title: w.title || '未命名', img: w.imageUrl || w.img,
                    author: w.author?.account || w.authorName || '匿名',
                    avatar: w.author?.avatar || 'https://picsum.photos/40/40?random=' + w.id,
                    likes: w.likes || 0, views: w.views || 0, time: w.createdAt || w.time || new Date().toISOString(),
                    comments: w.comments || []
                }));
                updateStats();
                applyFilterAndSort();
                render();
            } catch (e) { document.getElementById('worksGrid').innerHTML = '<div class="empty">加载失败，请重试</div>'; }
        }

        function updateStats() {
            document.getElementById('totalWorks').innerText = allWorks.length;
            document.getElementById('totalAuthors').innerText = new Set(allWorks.map(w => w.author)).size;
            document.getElementById('totalLikes').innerText = allWorks.reduce((s, w) => s + w.likes, 0);
        }

        function applyFilterAndSort() {
            let list = [...allWorks];
            const kw = document.getElementById('searchInput').value.toLowerCase();
            if (kw) list = list.filter(w => w.title.toLowerCase().includes(kw) || w.author.toLowerCase().includes(kw));
            if (currentFilter === 'hot') list.sort((a, b) => b.likes - a.likes);
            else list.sort((a, b) => new Date(b.time) - new Date(a.time));
            filteredWorks = list;
        }

        function render() {
            const grid = document.getElementById('worksGrid');
            if (!filteredWorks.length) { grid.innerHTML = '<div class="empty">暂无作品</div>'; return; }
            grid.innerHTML = filteredWorks.map(w => `
                <div class="work-card">
                    <img src="${w.img}" class="work-img" onclick="showDetail('${w.id}')" onerror="this.src='https://picsum.photos/300/200'">
                    <div class="work-info">
                        <div class="work-title">${escapeHtml(w.title)}</div>
                        <div class="work-author">👤 ${escapeHtml(w.author)}</div>
                        <div class="work-stats"><span>👁 ${w.views}</span><span>❤️ ${w.likes}</span><span>💬 ${w.comments.length}</span></div>
                        <div class="work-actions">
                            <button class="btn btn-view" onclick="showDetail('${w.id}')">详情</button>
                            <button class="btn btn-delete" onclick="deleteWork('${w.id}')">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        window.filterWorks = () => { applyFilterAndSort(); render(); };
        window.setFilter = (type, el) => {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            applyFilterAndSort(); render();
        };

        window.showDetail = function (id) {
            const work = filteredWorks.find(w => w.id == id) || allWorks.find(w => w.id == id);
            if (!work) return;
            currentWorkId = id;
            document.getElementById('modalTitle').innerText = work.title;
            document.getElementById('modalImg').src = work.img;
            document.getElementById('modalInfo').innerHTML = `
                <p><strong>作者：</strong>${escapeHtml(work.author)}</p>
                <p><strong>点赞：</strong>${work.likes}  <strong>浏览：</strong>${work.views}</p>
                <p><strong>发布时间：</strong>${new Date(work.time).toLocaleString()}</p>
            `;
            const commentsHtml = work.comments.length ? work.comments.map(c => `
                <div style="background:#fff; padding:10px; border-radius:8px; margin-bottom:8px;">
                    <strong>${escapeHtml(c.author || c.fromUser)}：</strong>${escapeHtml(c.text || c.content)}
                </div>`).join('') : '<p>暂无评论</p>';
            document.getElementById('modalComments').innerHTML = `<h4>评论 (${work.comments.length})</h4>${commentsHtml}`;
            document.getElementById('detailModal').classList.add('show');
        };

        window.closeModal = (e) => { if (!e || e.target.classList.contains('modal')) document.getElementById('detailModal').classList.remove('show'); };

        window.deleteWork = async function (id) {
            if (!confirm('确定删除？')) return;
            try {
                await fetch(`${API_BASE}/api/admin/works/${id}`, { method: 'DELETE' });
                allWorks = allWorks.filter(w => w.id != id);
                applyFilterAndSort(); updateStats(); render(); closeModal();
            } catch (e) { alert('删除失败'); }
        };
        window.deleteCurrentWork = () => { if (currentWorkId) deleteWork(currentWorkId); };

        window.onload = loadWorks;
    </script>
</body>
</html>
