<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 管理员界面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9699a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .content-card {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 50px 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            text-align: center;
        }

        .title {
            font-size: 28px;
            color: #8c5c3b;
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .description {
            color: #7a513c;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .btn {
            height: 50px;
            padding: 0 30px;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
            margin: 10px;
        }

            .btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .btn-secondary {
            background: #86987c;
        }
    </style>
</head>
<body>
    <div class="content-card">
        <div class="title">传统色彩数字工坊 - 管理员界面</div>
        <div class="description" id="adminTip">欢迎您，管理员！这里是您的专属管理界面，您可以管理用户、内容和系统设置。</div>
        <button class="btn" onclick="window.location.href='管理员主界面.html'">进入管理员主界面</button>
        <button class="btn" onclick="window.location.href='登录界面.html'">返回登录</button>
    </div>

    <script>
        // ===================== 管理员权限验证 + 后端对接 =====================
        window.onload = function () {
            // 从本地读取登录信息
            const user = JSON.parse(localStorage.getItem("user") || "null");

            // 如果没登录 或 不是管理员，直接踢回登录页
            if (!user || user.role !== "admin") {
                alert("您无权访问管理员页面！");
                location.href = "登录界面.html";
            } else {
                // 显示管理员名称
                document.getElementById("adminTip").innerText =
                    "欢迎您，管理员 " + user.username + "！这里是您的专属管理界面";
            }
        };

        // 退出登录
        function logout() {
            localStorage.clear();
            location.href = "登录界面.html";
        }
        <script>
            window.onload = function() {
                let currentUser = localStorage.getItem("currentUser");
            if (!currentUser) {
                alert("请先登录！");
            location.href = "登录界面.html";
            return;
      }
            currentUser = JSON.parse(currentUser);
            // 只有admin才能进管理页
            if (currentUser.role !== "admin") {
                alert("无管理员权限！");
            location.href = "主界面.html";
            return;
      }
            // 显示管理员账号
            document.getElementById("adminName").innerText = currentUser.account;
}
    </script>

    <script src="ai-chat.js"></script>
    <script src="lang.js"></script>
</body>
</html>
