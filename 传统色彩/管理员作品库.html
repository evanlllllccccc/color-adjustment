<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 管理员作品库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #e6d5c3;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #d4b2a2;
            background: #fff;
            color: #7a513c;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

            .filter-btn.active {
                background: #b17a54;
                color: #fff;
                border-color: #b17a54;
            }

            .filter-btn:hover:not(.active) {
                background: #f0e6d6;
            }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #fffaf5;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #e2c9b8;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #b17a54;
        }

        .stat-label {
            font-size: 12px;
            color: #7a513c;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .work-card {
            background: #fffaf5;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2c9b8;
            transition: 0.3s;
        }

            .work-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            }

        .work-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
        }

        .work-content {
            padding: 15px;
        }

        .work-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .work-title {
            font-size: 16px;
            color: #8c5c3b;
            font-weight: bold;
        }

        .work-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #a87f61;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .work-stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #a87f61;
            margin-bottom: 12px;
        }

        .work-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: 1px solid #e6d5c3;
            background: #fff;
            color: #7a513c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

            .btn-action:hover {
                background: #f0e6d6;
            }

        .btn-delete {
            background: #c95a5a;
            color: white;
            border-color: #c95a5a;
        }

            .btn-delete:hover {
                background: #b54545;
            }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a87f61;
            font-size: 18px;
            grid-column: 1 / -1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

            .modal-overlay.show {
                display: flex;
            }

        .modal {
            background: #fffaf5;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #d4b2a2;
        }

        .modal-title {
            font-size: 20px;
            color: #8c5c3b;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-work-img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-info {
            margin-bottom: 20px;
        }

        .modal-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2c9b8;
        }

        .modal-comments {
            max-height: 200px;
            overflow-y: auto;
        }

        .modal-comment-item {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e2c9b8;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn-delete {
            background: #c95a5a;
            color: white;
        }

        .modal-btn-close {
            background: #e6d5c3;
            color: #7a513c;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #b17a54;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .admin-badge {
            display: inline-block;
            background: #c95a5a;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 管理员作品库</div>
        <button class="header-btn" onclick="logout()">返回登录界面</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="nav-item" onclick="goToPage('管理员主界面.html')">首页</div>
            <div class="nav-item" onclick="goToPage('管理员统计.html')">数据统计</div>
            <div class="nav-item" onclick="goToPage('管理员评论.html')">评论监管</div>
            <div class="nav-item" onclick="goToPage('管理员素材.html')">素材管理</div>
            <div class="nav-item active" onclick="goToPage('管理员作品库.html')">用户作品库</div>
            <div class="nav-item" onclick="goToPage('管理员排行榜.html')">热度排行</div>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">
                    用户作品库
                    <span class="admin-badge">管理员模式</span>
                </div>

                <div class="stats-bar">
                    <div class="stat-box">
                        <div class="stat-number" id="totalWorks">0</div>
                        <div class="stat-label">作品总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalAuthors">0</div>
                        <div class="stat-label">作者人数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalLikes">0</div>
                        <div class="stat-label">总点赞数</div>
                    </div>
                </div>

                <div class="filter-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索作品或作者..." oninput="filterWorks()">
                    <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
                    <button class="filter-btn" onclick="setFilter('hot', this)">最热</button>
                    <button class="filter-btn" onclick="setFilter('new', this)">最新</button>
                </div>

                <button class="refresh-btn" onclick="loadGallery()">🔄 刷新数据</button>

                <div class="gallery-grid" id="galleryGrid">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">作品详情</div>
            <img src="" class="modal-work-img" id="modalImg">
            <div class="modal-info" id="modalInfo"></div>
            <div class="modal-comments" id="modalComments"></div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-delete" id="modalDeleteBtn" onclick="deleteCurrentWork()">🗑️ 删除作品</button>
                <button class="modal-btn modal-btn-close" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const API_BASE = 'https://color-adjustment-production.up.railway.app';
            // 管理员 token，假设存储在 localStorage，键名可能为 'authToken' 或 'adminToken'
            const authToken = localStorage.getItem('authToken') || localStorage.getItem('adminToken');

            // 状态
            let allWorks = [];           // 原始作品列表
            let filteredWorks = [];      // 当前显示的作品列表
            let currentFilter = 'all';
            let currentWorkId = null;
            let searchKeyword = '';

            // 检查登录状态
            if (!authToken) {
                alert('请先登录管理员账号');
                window.location.href = '管理员界面.html';
            }

            // 通用请求
            async function apiRequest(endpoint, options = {}) {
                const headers = {
                    'Authorization': `Bearer ${authToken}`,
                    ...options.headers
                };
                if (!(options.body instanceof FormData)) {
                    headers['Content-Type'] = 'application/json';
                }
                const resp = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
                if (resp.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('adminToken');
                    window.location.href = '管理员界面.html';
                    throw new Error('登录已过期');
                }
                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(`请求失败: ${resp.status} ${err}`);
                }
                return resp.json();
            }

            // 登出
            window.logout = function () {
                localStorage.removeItem('authToken');
                localStorage.removeItem('adminToken');
                window.location.href = '管理员界面.html';
            };

            window.goToPage = function (page) {
                window.location.href = page;
            };

            // 加载所有作品（管理员接口）
            async function loadGallery() {
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = '<div class="empty-state">加载中...</div>';

                try {
                    // 假设管理员获取所有作品的接口为 /api/admin/works
                    const data = await apiRequest('/api/admin/works');
                    const works = data.works || data || [];

                    // 转换数据格式
                    allWorks = works.map(work => ({
                        id: work.id,
                        title: work.title || '未命名',
                        img: work.imageUrl || work.img || 'https://picsum.photos/400/300?random=' + work.id,
                        author: work.author?.account || work.authorName || '未知作者',
                        authorAvatar: work.author?.avatar || `https://picsum.photos/200/200?random=${work.author?.account?.length || 10}`,
                        likes: work.likes || 0,
                        views: work.views || 0,
                        time: work.createdAt || work.time || new Date().toISOString(),
                        comments: work.comments || []
                    }));

                    // 更新统计
                    updateStats();

                    // 应用当前筛选
                    applyFilterAndSort();
                    renderGallery();
                } catch (e) {
                    console.error('加载作品失败', e);
                    grid.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
                }
            }

            function updateStats() {
                const totalWorks = allWorks.length;
                const authors = new Set(allWorks.map(w => w.author)).size;
                const totalLikes = allWorks.reduce((sum, w) => sum + w.likes, 0);
                document.getElementById('totalWorks').innerText = totalWorks;
                document.getElementById('totalAuthors').innerText = authors;
                document.getElementById('totalLikes').innerText = totalLikes;
            }

            function applyFilterAndSort() {
                // 先复制一份用于筛选
                let list = [...allWorks];

                // 搜索过滤
                if (searchKeyword) {
                    const kw = searchKeyword.toLowerCase();
                    list = list.filter(w =>
                        w.title.toLowerCase().includes(kw) ||
                        w.author.toLowerCase().includes(kw)
                    );
                }

                // 排序
                switch (currentFilter) {
                    case 'hot':
                        list.sort((a, b) => b.likes - a.likes);
                        break;
                    case 'new':
                        list.sort((a, b) => new Date(b.time) - new Date(a.time));
                        break;
                    default: // all
                        list.sort((a, b) => new Date(b.time) - new Date(a.time));
                        break;
                }
                filteredWorks = list;
            }

            function renderGallery() {
                const grid = document.getElementById('galleryGrid');
                if (filteredWorks.length === 0) {
                    grid.innerHTML = '<div class="empty-state">暂无作品</div>';
                    return;
                }

                grid.innerHTML = filteredWorks.map(work => `
                    <div class="work-card">
                        <img src="${work.img}" class="work-image" onclick="showDetail('${work.id}')" alt="${escapeHtml(work.title)}" onerror="this.src='https://picsum.photos/400/300?random=${work.id}'">
                        <div class="work-content">
                            <div class="work-header">
                                <div class="work-title">${escapeHtml(work.title)}</div>
                            </div>
                            <div class="work-author">
                                <img src="${work.authorAvatar}" class="author-avatar" onerror="this.src='https://picsum.photos/200/200?random=avatar'">
                                <span>${escapeHtml(work.author)}</span>
                            </div>
                            <div class="work-stats">
                                <span>👁 ${work.views}</span>
                                <span>👍 ${work.likes}</span>
                                <span>💬 ${work.comments.length}</span>
                            </div>
                            <div class="work-actions">
                                <button class="btn-action" onclick="showDetail('${work.id}')">查看详情</button>
                                <button class="btn-action btn-delete" onclick="deleteWork('${work.id}')">删除</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            window.filterWorks = function () {
                searchKeyword = document.getElementById('searchInput').value;
                applyFilterAndSort();
                renderGallery();
            };

            window.setFilter = function (type, element) {
                currentFilter = type;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
                applyFilterAndSort();
                renderGallery();
            };

            window.showDetail = async function (workId) {
                const work = filteredWorks.find(w => w.id === workId) || allWorks.find(w => w.id === workId);
                if (!work) return;

                currentWorkId = workId;

                document.getElementById('modalTitle').innerText = work.title;
                document.getElementById('modalImg').src = work.img;

                document.getElementById('modalInfo').innerHTML = `
                    <div class="modal-info-item"><span>作者</span><span>${escapeHtml(work.author)}</span></div>
                    <div class="modal-info-item"><span>点赞数</span><span>${work.likes}</span></div>
                    <div class="modal-info-item"><span>浏览量</span><span>${work.views}</span></div>
                    <div class="modal-info-item"><span>发布时间</span><span>${new Date(work.time).toLocaleString()}</span></div>
                `;

                // 评论可能需另外获取，这里直接展示作品数据里的comments
                const commentsHtml = work.comments.length > 0
                    ? work.comments.map(c => `
                        <div class="modal-comment-item">
                            <strong>${escapeHtml(c.author || c.fromUser || '用户')}:</strong> ${escapeHtml(c.text || c.content)}
                            <div style="font-size:12px;color:#a87f61;margin-top:5px;">${new Date(c.time || c.createdAt).toLocaleString()}</div>
                        </div>
                    `).join('')
                    : '<div style="color:#a87f61;text-align:center;">暂无评论</div>';

                document.getElementById('modalComments').innerHTML = `
                    <h4 style="color:#8c5c3b;margin-bottom:10px;">评论 (${work.comments.length})</h4>
                    ${commentsHtml}
                `;

                document.getElementById('detailModal').classList.add('show');
            };

            window.closeModal = function (event) {
                if (!event || event.target.id === 'detailModal' || event.target.classList.contains('modal-overlay')) {
                    document.getElementById('detailModal').classList.remove('show');
                    currentWorkId = null;
                }
            };

            window.deleteWork = async function (workId) {
                if (!confirm('确定要删除这个作品吗？此操作不可恢复！')) return;

                try {
                    await apiRequest(`/api/admin/works/${workId}`, { method: 'DELETE' });
                    alert('作品已删除');
                    // 从本地列表中移除
                    allWorks = allWorks.filter(w => w.id !== workId);
                    applyFilterAndSort();
                    updateStats();
                    renderGallery();
                    closeModal();
                } catch (e) {
                    alert('删除失败: ' + e.message);
                }
            };

            window.deleteCurrentWork = function () {
                if (!currentWorkId) return;
                deleteWork(currentWorkId);
            };

            // 初始化
            window.onload = function () {
                loadGallery();
                // 可设置定时刷新，但非必须
                // setInterval(loadGallery, 30000);
            };
        })();
    </script>
</body>
</html>
