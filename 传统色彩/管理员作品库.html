<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 管理员作品库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #e6d5c3;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid #d4b2a2;
            background: #fff;
            color: #7a513c;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

            .filter-btn.active {
                background: #b17a54;
                color: #fff;
                border-color: #b17a54;
            }

            .filter-btn:hover:not(.active) {
                background: #f0e6d6;
            }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #fffaf5;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #e2c9b8;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #b17a54;
        }

        .stat-label {
            font-size: 12px;
            color: #7a513c;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .work-card {
            background: #fffaf5;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2c9b8;
            transition: 0.3s;
        }

            .work-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            }

        .work-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
        }

        .work-content {
            padding: 15px;
        }

        .work-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .work-title {
            font-size: 16px;
            color: #8c5c3b;
            font-weight: bold;
        }

        .work-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #a87f61;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .work-stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #a87f61;
            margin-bottom: 12px;
        }

        .work-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: 1px solid #e6d5c3;
            background: #fff;
            color: #7a513c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

            .btn-action:hover {
                background: #f0e6d6;
            }

        .btn-delete {
            background: #c95a5a;
            color: white;
            border-color: #c95a5a;
        }

            .btn-delete:hover {
                background: #b54545;
            }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a87f61;
            font-size: 18px;
            grid-column: 1 / -1;
        }

        /* 详情模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

            .modal-overlay.show {
                display: flex;
            }

        .modal {
            background: #fffaf5;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #d4b2a2;
        }

        .modal-title {
            font-size: 20px;
            color: #8c5c3b;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-work-img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-info {
            margin-bottom: 20px;
        }

        .modal-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2c9b8;
        }

        .modal-comments {
            max-height: 200px;
            overflow-y: auto;
        }

        .modal-comment-item {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e2c9b8;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn-delete {
            background: #c95a5a;
            color: white;
        }

        .modal-btn-close {
            background: #e6d5c3;
            color: #7a513c;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #b17a54;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .admin-badge {
            display: inline-block;
            background: #c95a5a;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 管理员作品库</div>
        <button class="header-btn" onclick="window.location.href='管理员界面.html'">返回登录界面</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="nav-item" onclick="goToPage('管理员主界面.html')">首页</div>
            <div class="nav-item" onclick="goToPage('管理员统计.html')">数据统计</div>
            <div class="nav-item" onclick="goToPage('管理员评论.html')">评论监管</div>
            <div class="nav-item" onclick="goToPage('管理员素材.html')">素材管理</div>
            <div class="nav-item active" onclick="goToPage('管理员作品库.html')">用户作品库</div>
            <div class="nav-item" onclick="goToPage('管理员排行榜.html')">热度排行</div>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">
                    用户作品库
                    <span class="admin-badge">管理员模式</span>
                </div>

                <div class="stats-bar">
                    <div class="stat-box">
                        <div class="stat-number" id="totalWorks">0</div>
                        <div class="stat-label">作品总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalAuthors">0</div>
                        <div class="stat-label">作者人数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalLikes">0</div>
                        <div class="stat-label">总点赞数</div>
                    </div>
                </div>

                <div class="filter-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索作品或作者..." oninput="filterWorks()">
                    <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
                    <button class="filter-btn" onclick="setFilter('hot', this)">最热</button>
                    <button class="filter-btn" onclick="setFilter('new', this)">最新</button>
                </div>

                <button class="refresh-btn" onclick="loadGallery()">🔄 刷新数据</button>

                <div class="gallery-grid" id="galleryGrid">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">作品详情</div>
            <img src="" class="modal-work-img" id="modalImg">
            <div class="modal-info" id="modalInfo"></div>
            <div class="modal-comments" id="modalComments"></div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-delete" id="modalDeleteBtn" onclick="deleteCurrentWork()">🗑️ 删除作品</button>
                <button class="modal-btn modal-btn-close" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let allWorks = [];
        let currentFilter = 'all';
        let currentWorkId = null;

        function goToPage(page) {
            window.location.href = page;
        }

        function setFilter(type, element) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            switch (type) {
                case 'all':
                    allWorks.sort((a, b) => new Date(b.time) - new Date(a.time));
                    break;
                case 'hot':
                    allWorks.sort((a, b) => b.likes - a.likes);
                    break;
                case 'new':
                    allWorks.sort((a, b) => new Date(b.time) - new Date(a.time));
                    break;
            }
            renderGallery();
        }

        function filterWorks() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allWorks.filter(work =>
                work.title.toLowerCase().includes(keyword) ||
                work.author.toLowerCase().includes(keyword)
            );
            renderGallery(filtered);
        }

        function loadGallery() {
            allWorks = [];
            let totalLikes = 0;
            let authors = new Set();

            // 收集所有作品
            for (let key in localStorage) {
                if (key.startsWith("myWorks_")) {
                    const author = key.replace("myWorks_", "");
                    authors.add(author);
                    const userDetails = JSON.parse(localStorage.getItem("userDetails_" + author) || "{}");
                    const works = JSON.parse(localStorage.getItem(key) || "[]");

                    works.forEach((work, idx) => {
                        totalLikes += work.likes || 0;
                        allWorks.push({
                            id: author + "_" + idx,
                            title: work.title,
                            img: work.img,
                            author: author,
                            authorAvatar: userDetails.avatar || `https://picsum.photos/200/200?random=${author.length}`,
                            likes: work.likes || 0,
                            views: work.views || 0,
                            time: work.time || new Date().toISOString(),
                            comments: work.comments || []
                        });
                    });
                }
            }

            // 更新统计
            document.getElementById('totalWorks').innerText = allWorks.length;
            document.getElementById('totalAuthors').innerText = authors.size;
            document.getElementById('totalLikes').innerText = totalLikes;

            // 默认排序
            allWorks.sort((a, b) => new Date(b.time) - new Date(a.time));
            renderGallery();
        }

        function renderGallery(works = allWorks) {
            const grid = document.getElementById('galleryGrid');

            if (works.length === 0) {
                grid.innerHTML = '<div class="empty-state">暂无作品</div>';
                return;
            }

            grid.innerHTML = works.map(work => `
            <div class="work-card">
              <img src="${work.img}" class="work-image" onclick="showDetail('${work.id}')" alt="${work.title}">
              <div class="work-content">
                <div class="work-header">
                  <div class="work-title">${work.title}</div>
                </div>
                <div class="work-author">
                  <img src="${work.authorAvatar}" class="author-avatar">
                  <span>${work.author}</span>
                </div>
                <div class="work-stats">
                  <span>👁 ${work.views}</span>
                  <span>👍 ${work.likes}</span>
                  <span>💬 ${work.comments.length}</span>
                </div>
                <div class="work-actions">
                  <button class="btn-action" onclick="showDetail('${work.id}')">查看详情</button>
                  <button class="btn-action btn-delete" onclick="deleteWork('${work.id}')">删除</button>
                </div>
              </div>
            </div>
          `).join('');
        }

        function showDetail(workId) {
            const work = allWorks.find(w => w.id === workId);
            if (!work) return;

            currentWorkId = workId;

            document.getElementById('modalTitle').innerText = work.title;
            document.getElementById('modalImg').src = work.img;

            document.getElementById('modalInfo').innerHTML = `
            <div class="modal-info-item">
              <span>作者</span>
              <span>${work.author}</span>
            </div>
            <div class="modal-info-item">
              <span>点赞数</span>
              <span>${work.likes}</span>
            </div>
            <div class="modal-info-item">
              <span>浏览量</span>
              <span>${work.views}</span>
            </div>
            <div class="modal-info-item">
              <span>发布时间</span>
              <span>${new Date(work.time).toLocaleString()}</span>
            </div>
          `;

            const commentsHtml = work.comments.length > 0
                ? work.comments.map(c => `
                <div class="modal-comment-item">
                  <strong>${c.author}:</strong> ${c.text}
                  <div style="font-size:12px;color:#a87f61;margin-top:5px;">${new Date(c.time).toLocaleString()}</div>
                </div>
              `).join('')
                : '<div style="color:#a87f61;text-align:center;">暂无评论</div>';

            document.getElementById('modalComments').innerHTML = `
            <h4 style="color:#8c5c3b;margin-bottom:10px;">评论 (${work.comments.length})</h4>
            ${commentsHtml}
          `;

            document.getElementById('detailModal').classList.add('show');
        }

        function closeModal(event) {
            if (!event || event.target.id === 'detailModal') {
                document.getElementById('detailModal').classList.remove('show');
                currentWorkId = null;
            }
        }

        function deleteWork(workId) {
            if (!confirm('确定要删除这个作品吗？此操作不可恢复！')) return;

            const [author, idx] = workId.split('_');
            const worksKey = "myWorks_" + author;
            const works = JSON.parse(localStorage.getItem(worksKey) || "[]");

            if (works[idx]) {
                works.splice(idx, 1);
                localStorage.setItem(worksKey, JSON.stringify(works));
                alert('作品已删除');
                loadGallery();
            }
        }

        function deleteCurrentWork() {
            if (!currentWorkId) return;
            deleteWork(currentWorkId);
            closeModal();
        }

        window.onload = function () {
            loadGallery();
            setInterval(loadGallery, 30000);
        };
    </script>
    <script src="ai-chat.js"></script>
</body>
</html>
