<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>基础图案图库 | Traditional Pattern Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    body {
      min-height: 100vh;
      background: url("1.jpg") no-repeat center center fixed;
      background-size: cover;
      background-color: #f8f3e9;
      padding: 20px;
    }
    header {
      background: rgba(255,250,240,0.95);
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #e6d5c3;
      margin-bottom:30px;
    }
    .logo {
      font-size:24px;
      font-weight:bold;
      color:#8c5c3b;
    }
    .nav-right{
      display:flex;gap:20px;align-items:center;
    }
    .nav-right a{
      color:#8c5c3b;text-decoration:none;cursor:pointer;
    }
    .nav-right a:hover{color:#b17a54;}

    .container{
      max-width:1200px;margin:0 auto;
      background:rgba(255,250,240,0.9);
      padding:30px;border-radius:12px;
    }
    .title{text-align:center;margin-bottom:30px;}
    .title h1{color:#5a3c2c;margin-bottom:10px;}
    .title p{color:#7a513c;}

    .pattern-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:25px;
    }
    .pattern-card{
      background:#fff;border:1px solid #e6d5c3;
      border-radius:10px;overflow:hidden;cursor:pointer;
      transition:0.3s;
    }
    .pattern-card:hover{
      transform:translateY(-4px);box-shadow:0 6px 16px rgba(139,90,43,0.15);
    }
    .pattern-card img{
      width:100%;height:180px;object-fit:cover;
    }
    .pattern-name{
      padding:12px;text-align:center;color:#8c5c3b;
    }
    .tip-text{
      margin:20px auto;text-align:center;color:#a87f61;
    }
  </style>
</head>
<body>
<header>
  <div class="logo">传统色彩数字工坊</div>
  <div class="nav-right">
    <a href="染色界面.html">返回首页</a>
  </div>
</header>

<div class="container">
  <div class="title">
    <h1>基础图案图库</h1>
    <p>选择团扇、汉服纹样模板，开始定制染色</p>
  </div>

  <div class="pattern-grid">
    <div class="pattern-card" data-src="fan1">
      <img src="https://picsum.photos/400/300?random=101" alt="">
      <div class="pattern-name">古典团扇 · 祥云纹</div>
    </div>
    <div class="pattern-card" data-src="hanfu1">
      <img src="https://picsum.photos/400/300?random=102" alt="">
      <div class="pattern-name">汉服直袖 · 素面布料</div>
    </div>
    <div class="pattern-card" data-src="hanfu2">
      <img src="https://picsum.photos/400/300?random=103" alt="">
      <div class="pattern-name">齐胸襦裙 · 花枝底纹</div>
    </div>
    <div class="pattern-card" data-src="fan2">
      <img src="https://picsum.photos/400/300?random=104" alt="">
      <div class="pattern-name">宫扇圆柄 · 花鸟纹样</div>
    </div>
  </div>

  <p class="tip-text" id="selectTip"></p>
</div>

<script>
// 点击图案 → 提示 + 跳转染色页
const cards = document.querySelectorAll(".pattern-card");
cards.forEach(card=>{
  card.onclick = function(){
    let tip = "已选中模板，正在前往染色工坊……";
    document.getElementById("selectTip").innerText = tip;
    // 携带选中图案参数跳到染色界面
    let pid = this.getAttribute("data-src");
    setTimeout(()=>{
      location.href = "染色界面.html?pattern="+pid;
    },800);
  }
});
</script>
<script src="ai-chat.js"></script>
</body>
</html>
