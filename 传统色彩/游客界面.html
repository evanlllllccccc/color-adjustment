<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 游客模式</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("1.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #d4b2a2;
            padding: 20px 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8c5c3b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

            .nav a {
                color: #7a513c;
                text-decoration: none;
                font-size: 16px;
                transition: 0.3s;
                padding: 8px 16px;
                border-radius: 20px;
            }

                .nav a:hover {
                    background: rgba(177, 122, 84, 0.1);
                    color: #b17a54;
                }

        .user-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #b17a54;
            color: white;
        }

        .btn-secondary {
            background: transparent;
            color: #b17a54;
            border: 1px solid #b17a54;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(177, 122, 84, 0.3);
        }

        .main {
            flex: 1;
            padding: 40px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .guest-banner {
            background: linear-gradient(135deg, rgba(255, 250, 245, 0.95), rgba(240, 230, 214, 0.95));
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
            border: 1px solid #e2c9b8;
            backdrop-filter: blur(10px);
        }

            .guest-banner h2 {
                color: #8c5c3b;
                font-size: 24px;
                margin-bottom: 10px;
            }

            .guest-banner p {
                color: #7a513c;
                font-size: 16px;
                margin-bottom: 20px;
            }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

            .section-title h2 {
                color: #8c5c3b;
                font-size: 28px;
                margin-bottom: 10px;
            }

            .section-title p {
                color: #7a513c;
                font-size: 16px;
            }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .work-card {
            background: rgba(255, 250, 245, 0.95);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2c9b8;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

            .work-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            }

        .work-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0e6d6;
        }

        .work-content {
            padding: 20px;
        }

        .work-title {
            font-size: 18px;
            font-weight: bold;
            color: #5a3c2c;
            margin-bottom: 8px;
        }

        .work-author {
            font-size: 14px;
            color: #7a513c;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .work-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            padding: 10px;
            background: #fffaf5;
            border-radius: 8px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #b17a54;
        }

        .stat-label {
            font-size: 12px;
            color: #7a513c;
            margin-top: 4px;
        }

        .work-description {
            font-size: 14px;
            color: #7a513c;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .work-time {
            font-size: 12px;
            color: #a87f61;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a87f61;
            font-size: 18px;
            background: rgba(255, 250, 245, 0.95);
            border-radius: 16px;
            border: 1px solid #e2c9b8;
        }

        .footer {
            background: rgba(140, 92, 59, 0.95);
            color: white;
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid #d4b2a2;
            backdrop-filter: blur(10px);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .footer p {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

            .footer-links a {
                color: rgba(255, 255, 255, 0.8);
                text-decoration: none;
                font-size: 14px;
                transition: 0.3s;
            }

                .footer-links a:hover {
                    color: white;
                }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                padding: 0 20px;
            }

            .nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                padding: 0 20px;
            }

            .works-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <a href="游客界面.html" class="logo">
                🎨 传统色彩数字工坊
            </a>
            <nav class="nav">
                <a href="游客界面.html">首页</a>
                <a href="gallery.html">作品库</a>
                <a href="rank.html">排行榜</a>
                <a href="介绍界面.html">项目介绍</a>
            </nav>
            <div class="user-section">
                <a href="登录界面.html" class="btn btn-secondary">登录/注册</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="guest-banner">
                <h2>欢迎使用游客模式</h2>
                <p>您现在处于游客模式，可以浏览热门染色作品。登录后可解锁更多功能。</p>
                <a href="登录界面.html" class="btn btn-primary">立即登录</a>
            </div>

            <section id="works" class="works-section">
                <div class="section-title">
                    <h2>🔥 热门染色作品</h2>
                    <p>实时展示点赞量最高的优秀作品</p>
                </div>

                <div class="works-grid" id="worksGrid">
                    <div class="empty-state">加载中...</div>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="游客界面.html">首页</a>
                <a href="gallery.html">作品库</a>
                <a href="rank.html">排行榜</a>
                <a href="介绍界面.html">项目介绍</a>
            </div>
            <p>© 2026 传统色彩数字工坊 - 传承中国传统色彩文化</p>
            <p>游客模式 | 仅支持浏览功能</p>
        </div>
    </footer>

    <script>
        (function () {
            // 后端 API 基础地址
            const API_BASE = 'https://color-adjustment-production.up.railway.app';

            // 从后端获取热门作品（公开接口，无需 token）
            async function loadHotWorks() {
                const worksGrid = document.getElementById('worksGrid');

                try {
                    // 假设后端提供公开作品列表接口，支持按热度排序
                    // 可根据实际 API 调整参数，例如 ?sort=likes&limit=6
                    const response = await fetch(`${API_BASE}/api/works/public?sort=likes&limit=6`);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    // 根据实际返回结构调整：可能是 { works: [...] } 或直接数组
                    const works = Array.isArray(data) ? data : (data.works || data.data || []);

                    if (works.length === 0) {
                        worksGrid.innerHTML = `
                                <div class="empty-state" style="grid-column: 1/-1;">
                                    <div style="font-size:48px; margin-bottom:15px;">🎨</div>
                                    暂无作品<br>
                                    <a href="login.html" style="color:#b17a54; text-decoration:none; margin-top:10px; display:inline-block;">登录后成为第一个创作者 →</a>
                                </div>
                            `;
                        return;
                    }

                    // 渲染作品卡片
                    worksGrid.innerHTML = works.map(work => {
                        // 兼容字段名差异
                        const title = work.title || '未命名作品';
                        const imageUrl = work.imageUrl || work.img || 'https://picsum.photos/400/300?random=' + work.id;
                        const authorName = work.author?.account || work.authorName || '匿名用户';
                        const authorAvatar = work.author?.avatar || `https://picsum.photos/200/200?random=${authorName.length}`;
                        const likes = work.likes || 0;
                        const views = work.views || 0;
                        const createdAt = work.createdAt || work.time || new Date().toISOString();

                        return `
                                <div class="work-card">
                                    <img src="${imageUrl}" class="work-image" alt="${title}" onerror="this.src='https://picsum.photos/400/300?random=${work.id}'">
                                    <div class="work-content">
                                        <div class="work-title">${escapeHtml(title)}</div>
                                        <div class="work-author">
                                            <img src="${authorAvatar}" class="author-avatar" onerror="this.src='https://picsum.photos/200/200?random=avatar'">
                                            <span>作者：${escapeHtml(authorName)}</span>
                                        </div>
                                        <div class="work-stats">
                                            <div class="stat">
                                                <div class="stat-value">❤️ ${likes}</div>
                                                <div class="stat-label">点赞</div>
                                            </div>
                                            <div class="stat">
                                                <div class="stat-value">👁️ ${views}</div>
                                                <div class="stat-label">浏览</div>
                                            </div>
                                        </div>
                                        <div class="work-time">发布时间：${new Date(createdAt).toLocaleDateString()}</div>
                                    </div>
                                </div>
                            `;
                    }).join('');

                } catch (error) {
                    console.error('加载热门作品失败:', error);
                    worksGrid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1/-1;">
                                <div style="font-size:48px; margin-bottom:15px;">⚠️</div>
                                加载失败，请稍后重试<br>
                                <button onclick="location.reload()" style="margin-top:15px; padding:8px 20px; background:#b17a54; color:white; border:none; border-radius:20px; cursor:pointer;">重新加载</button>
                            </div>
                        `;
                }
            }

            // 简单的转义函数防止 XSS
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 页面加载时执行
            window.onload = loadHotWorks;
        })();
    </script>
    <!-- 如果不需要 AI 聊天可以删除，但保留也无妨 -->
    <!-- <script src="ai-chat.js"></script> -->
</body>
</html>
