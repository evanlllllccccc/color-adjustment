        <h1>传统色彩数字工坊 · 项目介绍</h1>

        <p>传统色彩数字工坊是一个致力于保护、传承与推广中国传统色彩文化的数字化平台。我们收录了历代经典传统色彩，包括名称、色值、文化典故与应用场景，让东方美学以现代方式呈现。</p>

        <p>本项目通过数字化技术，让传统色彩不再只存在于古籍与文物中，而是成为人人可查阅、可使用、可创作的设计资源。</p>

        <p>平台包含传统色图鉴、染色工坊、色彩科普、文化展示等多个模块，适合设计爱好者、文化研究者、学生及大众用户使用。</p>

        <p>我们希望通过科技，让传统色彩重新走进当代生活，让东方之美被更多人看见与传承。</p>
