<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 评论监管</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #fffaf5;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #e2c9b8;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #b17a54;
        }

        .stat-label {
            font-size: 12px;
            color: #7a513c;
        }

        .comments-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .comment-item {
            background: #fffaf5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e2c9b8;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .comment-content {
            flex: 1;
        }

        .comment-header {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            align-items: center;
        }

        .comment-user {
            font-size: 16px;
            color: #8c5c3b;
            font-weight: bold;
        }

        .comment-work {
            font-size: 13px;
            color: #b17a54;
            background: #f0e6d6;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .comment-text {
            font-size: 14px;
            color: #7a513c;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .comment-time {
            font-size: 12px;
            color: #a87f61;
        }

        .comment-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            height: 36px;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-delete {
            background: #c45c5c;
            color: #fff;
        }

            .btn-delete:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .btn-view {
            background: #b17a54;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            color: #a87f61;
            padding: 40px;
            font-size: 16px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #b17a54;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 评论监管</div>
        <button class="header-btn" onclick="logout()">返回登录</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="nav-item" onclick="goToPage('管理员主界面.html')">首页</div>
            <div class="nav-item" onclick="goToPage('管理员统计.html')">数据统计</div>
            <div class="nav-item active" onclick="goToPage('管理员评论.html')">评论监管</div>
            <div class="nav-item" onclick="goToPage('管理员素材.html')">素材管理</div>
            <div class="nav-item" onclick="goToPage('管理员作品库.html')">用户作品库</div>
            <div class="nav-item" onclick="goToPage('管理员排行榜.html')">热度排行</div>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">用户评论监管（云端实时数据）</div>

                <div class="stats-bar">
                    <div class="stat-box">
                        <div class="stat-number" id="totalComments">0</div>
                        <div class="stat-label">总评论数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="todayComments">0</div>
                        <div class="stat-label">今日评论</div>
                    </div>
                </div>

                <button class="refresh-btn" onclick="loadComments()">🔄 刷新评论</button>

                <div class="comments-list" id="commentsList">
                    <div class="empty-state">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===================== 后端地址 =====================
        const API = "https://color-adjustment-production.up.railway.app";

        let commentList = [];

        function goToPage(page) {
            window.location.href = page;
        }

        // 退出登录
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "login.html";
        }

        // ===================== 加载云端评论 =====================
        async function loadComments() {
            try {
                let res = await fetch(API + "/api/comments");
                let data = await res.json();
                commentList = data || [];

                // 统计
                document.getElementById('totalComments').innerText = commentList.length;
                const today = new Date().toDateString();
                const todayCount = commentList.filter(c =>
                    new Date(c.createTime).toDateString() === today
                ).length;
                document.getElementById('todayComments').innerText = todayCount;

                renderComments();
            } catch (e) {
                document.getElementById("commentsList").innerHTML = `<div class="empty-state">加载失败</div>`;
            }
        }

        // 渲染评论
        function renderComments() {
            const list = document.getElementById('commentsList');
            if (commentList.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无评论</div>';
                return;
            }

            // 倒序
            const sorted = [...commentList].sort((a, b) => new Date(b.createTime) - new Date(a.createTime));

            list.innerHTML = sorted.map((c, idx) => `
                <div class="comment-item">
                    <div class="comment-content">
                        <div class="comment-header">
                            <div class="comment-user">${c.username}</div>
                            <div class="comment-work">素材ID：${c.imageId}</div>
                        </div>
                        <div class="comment-text">${c.content}</div>
                        <div class="comment-time">${new Date(c.createTime).toLocaleString()}</div>
                    </div>
                    <div class="comment-actions">
                        <button class="action-btn btn-delete" onclick="deleteComment(${c.id})">删除评论</button>
                    </div>
                </div>
                `).join('');
        }

        // ===================== 删除云端评论 =====================
        async function deleteComment(commentId) {
            if (!confirm("确定删除这条评论？")) return;
            try {
                await fetch(API + "/api/comment/" + commentId, { method: "DELETE" });
                alert("删除成功");
                loadComments();
            } catch (e) {
                alert("删除失败");
            }
        }

        // 权限验证 + 自动加载
        window.onload = function () {
            const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
            if (!user || user.role !== "admin") {
                alert("无管理员权限");
                window.location.href = "login.html";
                return;
            }
            loadComments();
        };
    </script>
    <script src="ai-chat.js"></script>
</body>
</html>
