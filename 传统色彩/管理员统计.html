<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 数据统计</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .stat-card {
            background: #fffaf5;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e2c9b8;
        }

        .stat-card-title {
            font-size: 18px;
            color: #8c5c3b;
            margin-bottom: 20px;
            font-weight: bold;
            border-bottom: 2px solid #f0e6d6;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2c9b8;
        }

            .stat-item:last-child {
                border-bottom: none;
            }

        .stat-label {
            font-size: 16px;
            color: #7a513c;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #b17a54;
        }

        .update-time {
            text-align: center;
            color: #a87f61;
            font-size: 14px;
            margin-top: 20px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #b17a54;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

            .refresh-btn:hover {
                background: #9a6843;
            }

        .error-message {
            color: #c95a5a;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 数据统计</div>
        <button class="header-btn" onclick="logout()">返回登录界面</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="nav-item" onclick="goToPage('管理员主界面.html')">首页</div>
            <div class="nav-item active" onclick="goToPage('管理员统计.html')">数据统计</div>
            <div class="nav-item" onclick="goToPage('管理员评论.html')">评论监管</div>
            <div class="nav-item" onclick="goToPage('管理员素材.html')">素材管理</div>
            <div class="nav-item" onclick="goToPage('管理员作品库.html')">用户作品库</div>
            <div class="nav-item" onclick="goToPage('管理员排行榜.html')">热度排行</div>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">数据统计</div>

                <button class="refresh-btn" onclick="loadStats()">🔄 刷新数据</button>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-title">用户统计</div>
                        <div class="stat-item">
                            <div class="stat-label">用户总人数</div>
                            <div class="stat-value" id="totalUsers">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">今日新增注册用户</div>
                            <div class="stat-value" id="newUsersToday">-</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-title">访问统计</div>
                        <div class="stat-item">
                            <div class="stat-label">今日浏览量</div>
                            <div class="stat-value" id="todayViews">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">总浏览量</div>
                            <div class="stat-value" id="totalViews">-</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-title">染色统计</div>
                        <div class="stat-item">
                            <div class="stat-label">今日染色次数</div>
                            <div class="stat-value" id="todayDyeCount">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">总染色次数</div>
                            <div class="stat-value" id="totalDyeCount">-</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-title">作品统计</div>
                        <div class="stat-item">
                            <div class="stat-label">作品总数</div>
                            <div class="stat-value" id="totalWorks">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">今日新增作品</div>
                            <div class="stat-value" id="newWorksToday">-</div>
                        </div>
                    </div>
                </div>

                <div class="update-time" id="updateTime">最后更新：--</div>
                <div id="errorMsg" class="error-message"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const API_BASE = 'https://color-adjustment-production.up.railway.app';
            const authToken = localStorage.getItem('authToken') || localStorage.getItem('adminToken');

            if (!authToken) {
                alert('请先登录管理员账号');
                window.location.href = '管理员界面.html';
            }

            async function apiRequest(endpoint, options = {}) {
                const headers = {
                    'Authorization': `Bearer ${authToken}`,
                    ...options.headers
                };
                if (!(options.body instanceof FormData)) {
                    headers['Content-Type'] = 'application/json';
                }
                const resp = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
                if (resp.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('adminToken');
                    window.location.href = '管理员界面.html';
                    throw new Error('登录已过期');
                }
                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(`请求失败: ${resp.status} ${err}`);
                }
                return resp.json();
            }

            window.logout = function () {
                localStorage.removeItem('authToken');
                localStorage.removeItem('adminToken');
                window.location.href = '管理员界面.html';
            };

            window.goToPage = function (page) {
                window.location.href = page;
            };

            // 加载统计数据
            async function loadStats() {
                const errorDiv = document.getElementById('errorMsg');
                errorDiv.innerHTML = '';

                // 重置显示为加载中
                const valueIds = ['totalUsers', 'newUsersToday', 'todayViews', 'totalViews',
                    'todayDyeCount', 'totalDyeCount', 'totalWorks', 'newWorksToday'];
                valueIds.forEach(id => document.getElementById(id).innerText = '...');

                try {
                    // 调用管理员统计接口，期望返回包含所有统计数据的对象
                    const data = await apiRequest('/api/admin/stats');

                    // 根据实际返回字段更新（此处做了兼容映射）
                    document.getElementById('totalUsers').innerText = data.totalUsers ?? data.users?.total ?? 0;
                    document.getElementById('newUsersToday').innerText = data.newUsersToday ?? data.users?.today ?? 0;
                    document.getElementById('todayViews').innerText = data.todayViews ?? data.views?.today ?? 0;
                    document.getElementById('totalViews').innerText = data.totalViews ?? data.views?.total ?? 0;
                    document.getElementById('todayDyeCount').innerText = data.todayDyeCount ?? data.dye?.today ?? 0;
                    document.getElementById('totalDyeCount').innerText = data.totalDyeCount ?? data.dye?.total ?? 0;
                    document.getElementById('totalWorks').innerText = data.totalWorks ?? data.works?.total ?? 0;
                    document.getElementById('newWorksToday').innerText = data.newWorksToday ?? data.works?.today ?? 0;

                    document.getElementById('updateTime').innerText = '最后更新：' + new Date().toLocaleString();
                } catch (e) {
                    console.error('加载统计数据失败', e);
                    errorDiv.innerHTML = '加载失败：' + e.message;
                    valueIds.forEach(id => document.getElementById(id).innerText = '错误');
                }
            }

            // 初始化加载
            window.onload = function () {
                loadStats();
                // 可选：每60秒自动刷新
                setInterval(loadStats, 60000);
            };

            // 将 loadStats 挂载到全局以便按钮调用
            window.loadStats = loadStats;
        })();
    </script>
</body>
</html>
