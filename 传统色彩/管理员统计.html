<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 数据统计</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .stat-card {
            background: #fffaf5;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e2c9b8;
        }

        .stat-card-title {
            font-size: 18px;
            color: #8c5c3b;
            margin-bottom: 20px;
            font-weight: bold;
            border-bottom: 2px solid #f0e6d6;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2c9b8;
        }

            .stat-item:last-child {
                border-bottom: none;
            }

        .stat-label {
            font-size: 16px;
            color: #7a513c;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #b17a54;
        }

        .update-time {
            text-align: center;
            color: #a87f61;
            font-size: 14px;
            margin-top: 20px;
        }

        .refresh-btn {
            padding: 10px 20px;
            background: #b17a54;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

            .refresh-btn:hover {
                background: #9a6843;
            }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 数据统计</div>
        <button class="header-btn" onclick="window.location.href='管理员界面.html'">返回登录界面</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="nav-item" onclick="goToPage('管理员主界面.html')">首页</div>
            <div class="nav-item active" onclick="goToPage('管理员统计.html')">数据统计</div>
            <div class="nav-item" onclick="goToPage('管理员评论.html')">评论监管</div>
            <div class="nav-item" onclick="goToPage('管理员素材.html')">素材管理</div>
            <div class="nav-item" onclick="goToPage('管理员作品库.html')">用户作品库</div>
            <div class="nav-item" onclick="goToPage('管理员排行榜.html')">热度排行</div>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">数据统计</div>

                <button class="refresh-btn" onclick="loadStats()">🔄 刷新数据</button>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-title">用户统计</div>
                        <div class="stat-item">
                            <div class="stat-label">用户总人数</div>
                            <div class="stat-value" id="totalUsers">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">今日新增注册用户</div>
                            <div class="stat-value" id="newUsersToday">0</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-title">访问统计</div>
                        <div class="stat-item">
                            <div class="stat-label">今日浏览量</div>
                            <div class="stat-value" id="todayViews">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">总浏览量</div>
                            <div class="stat-value" id="totalViews">0</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-title">染色统计</div>
                        <div class="stat-item">
                            <div class="stat-label">今日染色次数</div>
                            <div class="stat-value" id="todayDyeCount">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">总染色次数</div>
                            <div class="stat-value" id="totalDyeCount">0</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-title">作品统计</div>
                        <div class="stat-item">
                            <div class="stat-label">作品总数</div>
                            <div class="stat-value" id="totalWorks">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">今日新增作品</div>
                            <div class="stat-value" id="newWorksToday">0</div>
                        </div>
                    </div>
                </div>

                <div class="update-time" id="updateTime">最后更新：--</div>
            </div>
        </div>
    </div>

    <script>
        function goToPage(page) {
            window.location.href = page;
        }

        function loadStats() {
            // 统计用户总人数
            let totalUsers = 0;
            let newUsersToday = 0;
            const today = new Date().toDateString();

            for (let key in localStorage) {
                if (key.startsWith("userDetails_") || key.startsWith("myWorks_")) {
                    totalUsers++;
                }
            }

            // 检查今日新增（通过userDetails的时间戳）
            for (let key in localStorage) {
                if (key.startsWith("userDetails_")) {
                    const details = JSON.parse(localStorage.getItem(key) || "{}");
                    if (details.registerTime) {
                        const regDate = new Date(details.registerTime).toDateString();
                        if (regDate === today) newUsersToday++;
                    }
                }
            }

            // 今日浏览量
            const todayViews = parseInt(localStorage.getItem("visits_" + today) || "0");

            // 总浏览量
            let totalViews = 0;
            for (let key in localStorage) {
                if (key.startsWith("visits_")) {
                    totalViews += parseInt(localStorage.getItem(key) || "0");
                }
            }

            // 染色次数统计
            const todayDyeCount = parseInt(localStorage.getItem("dyeCount_" + today) || "0");
            let totalDyeCount = 0;
            for (let key in localStorage) {
                if (key.startsWith("dyeCount_")) {
                    totalDyeCount += parseInt(localStorage.getItem(key) || "0");
                }
            }

            // 作品统计
            let totalWorks = 0;
            let newWorksToday = 0;
            for (let key in localStorage) {
                if (key.startsWith("myWorks_")) {
                    const works = JSON.parse(localStorage.getItem(key) || "[]");
                    totalWorks += works.length;

                    // 统计今日新增作品
                    works.forEach(work => {
                        if (work.time) {
                            const workDate = new Date(work.time).toDateString();
                            if (workDate === today) newWorksToday++;
                        }
                    });
                }
            }

            // 更新显示
            document.getElementById('totalUsers').innerText = totalUsers;
            document.getElementById('newUsersToday').innerText = newUsersToday;
            document.getElementById('todayViews').innerText = todayViews;
            document.getElementById('totalViews').innerText = totalViews;
            document.getElementById('todayDyeCount').innerText = todayDyeCount;
            document.getElementById('totalDyeCount').innerText = totalDyeCount;
            document.getElementById('totalWorks').innerText = totalWorks;
            document.getElementById('newWorksToday').innerText = newWorksToday;

            document.getElementById('updateTime').innerText = '最后更新：' + new Date().toLocaleString();
        }

        window.onload = function () {
            loadStats();
            // 每30秒自动刷新
            setInterval(loadStats, 30000);
        };
    </script>
    <script src="ai-chat.js"></script>
</body>
</html>
