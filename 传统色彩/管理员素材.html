<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 素材管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .upload-form {
            background: #fffaf5;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e2c9b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 16px;
                color: #7a513c;
                margin-bottom: 10px;
            }

            .form-group input[type="file"] {
                width: 100%;
                padding: 15px;
                border: 1px solid #e2c9b8;
                border-radius: 6px;
                background: #fff;
            }

            .form-group input[type="text"] {
                width: 100%;
                height: 48px;
                padding: 0 16px;
                border: 1px solid #e2c9b8;
                border-radius: 6px;
                background: #fff;
                font-size: 16px;
                color: #5a3c2c;
            }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .action-btn {
            height: 48px;
            padding: 0 24px;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-upload {
            background: #86987c;
            color: #fff;
        }

            .btn-upload:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .btn-ai {
            background: #7a9cc6;
            color: #fff;
        }

            .btn-ai:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .material-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .material-item {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2c9b8;
            position: relative;
        }

            .material-item img {
                width: 100%;
                height: 160px;
                object-fit: cover;
            }

        .material-info {
            padding: 10px;
            font-size: 14px;
            color: #8c5c3b;
        }

        .material-del {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #c95a5a;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 素材管理</div>
        <button class="header-btn" onclick="logout()">返回登录界面</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="nav-item" onclick="goToPage('管理员主界面.html')">首页</div>
            <div class="nav-item" onclick="goToPage('管理员统计.html')">数据统计</div>
            <div class="nav-item" onclick="goToPage('管理员评论.html')">评论监管</div>
            <div class="nav-item active" onclick="goToPage('管理员素材.html')">素材管理</div>
            <div class="nav-item" onclick="goToPage('管理员AI评分.html')">AI评分</div>
            <div class="nav-item" onclick="goToPage('管理员排行榜.html')">热度排行</div>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">染色素材上传</div>
                <div class="upload-form">
                    <div class="form-group">
                        <label>选择素材图片</label>
                        <input type="file" id="materialFile" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>素材名称</label>
                        <input type="text" id="materialName" placeholder="请输入素材名称">
                    </div>
                    <div class="form-group">
                        <label>素材分类</label>
                        <input type="text" id="materialCategory" placeholder="请输入素材分类">
                    </div>
                    <div class="form-actions">
                        <button class="action-btn btn-upload" onclick="uploadMaterial()">上传素材</button>
                        <button class="action-btn btn-ai" onclick="generateAIRecommendations()">AI推荐标签</button>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div class="content-title">已上传素材（用户染色可见）</div>
                <div id="materialGrid" class="material-grid">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const API_BASE = 'https://color-adjustment-production.up.railway.app';
            const authToken = localStorage.getItem('authToken') || localStorage.getItem('adminToken');

            if (!authToken) {
                alert('请先登录管理员账号');
                window.location.href = '管理员界面.html';
            }

            async function apiRequest(endpoint, options = {}) {
                const headers = {
                    'Authorization': `Bearer ${authToken}`,
                    ...options.headers
                };
                if (!(options.body instanceof FormData)) {
                    headers['Content-Type'] = 'application/json';
                }
                const resp = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
                if (resp.status === 401) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('adminToken');
                    window.location.href = '管理员界面.html';
                    throw new Error('登录已过期');
                }
                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(`请求失败: ${resp.status} ${err}`);
                }
                return resp.json();
            }

            window.logout = function () {
                localStorage.removeItem('authToken');
                localStorage.removeItem('adminToken');
                window.location.href = '管理员界面.html';
            };

            window.goToPage = function (page) {
                window.location.href = page;
            };

            // 上传素材
            window.uploadMaterial = async function () {
                const fileInput = document.getElementById('materialFile');
                const nameInput = document.getElementById('materialName');
                const categoryInput = document.getElementById('materialCategory');

                const file = fileInput.files[0];
                const name = nameInput.value.trim();
                const category = categoryInput.value.trim();

                if (!file) { alert('请选择素材图片'); return; }
                if (!name) { alert('请输入素材名称'); return; }
                if (!category) { alert('请输入素材分类'); return; }

                const formData = new FormData();
                formData.append('image', file);
                formData.append('name', name);
                formData.append('category', category);

                try {
                    await apiRequest('/api/admin/materials', {
                        method: 'POST',
                        body: formData
                    });
                    alert('素材上传成功！');
                    fileInput.value = '';
                    nameInput.value = '';
                    categoryInput.value = '';
                    loadMaterialList();
                } catch (e) {
                    alert('上传失败: ' + e.message);
                }
            };

            // AI 推荐标签（模拟，可替换为真实AI接口）
            window.generateAIRecommendations = function () {
                const categories = ['自然风景', '传统纹样', '古典建筑', '花卉植物', '动物图案', '几何图形'];
                const randomCategory = categories[Math.floor(Math.random() * categories.length)];
                document.getElementById('materialCategory').value = randomCategory;
                alert('AI推荐标签生成成功！\n推荐分类：' + randomCategory);
            };

            // 加载素材列表
            async function loadMaterialList() {
                const grid = document.getElementById('materialGrid');
                grid.innerHTML = '加载中...';
                try {
                    const data = await apiRequest('/api/admin/materials');
                    const materials = data.materials || data || [];
                    if (materials.length === 0) {
                        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#a87f61;">暂无素材</div>';
                        return;
                    }
                    grid.innerHTML = materials.map(item => `
                        <div class="material-item">
                            <img src="${item.imageUrl || item.img}" alt="${escapeHtml(item.name)}" onerror="this.src='https://picsum.photos/200/160?random=${item.id}'">
                            <button class="material-del" onclick="deleteMaterial('${item.id}')">删除</button>
                            <div class="material-info">
                                <div>${escapeHtml(item.name)}</div>
                                <div style="font-size:12px;color:#a87f61;">${escapeHtml(item.category || '未分类')}</div>
                            </div>
                        </div>
                    `).join('');
                } catch (e) {
                    console.error('加载素材失败', e);
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#a87f61;">加载失败，请刷新重试</div>';
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 删除素材
            window.deleteMaterial = async function (id) {
                if (!confirm('确定删除该素材？用户将无法再使用！')) return;
                try {
                    await apiRequest(`/api/admin/materials/${id}`, { method: 'DELETE' });
                    alert('素材已删除');
                    loadMaterialList();
                } catch (e) {
                    alert('删除失败: ' + e.message);
                }
            };

            // 初始化
            window.onload = function () {
                loadMaterialList();
            };
        })();
    </script>
</body>
</html>
