<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>传统色彩数字工坊 - 素材管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", serif;
        }

        body {
            min-height: 100vh;
            background: url("https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/b1daa64170314c968fa59a04626ed1f2.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 250, 245, 0.93);
            padding: 20px 30px;
            border-bottom: 1px solid #d4b2a2;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #8c5c3b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-btn {
            height: 40px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            background: #b17a54;
            color: #fff;
        }

            .header-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .main-container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 250, 245, 0.93);
            border-right: 1px solid #d4b2a2;
            padding: 30px 0;
            backdrop-filter: blur(4px);
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 15px 30px;
            color: #7a513c;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }

            .nav-item:hover {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
            }

            .nav-item.active {
                background: rgba(177, 122, 84, 0.1);
                border-left-color: #b17a54;
                color: #b17a54;
                font-weight: bold;
            }

        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .content-card {
            background: rgba(255, 250, 245, 0.93);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #d4b2a2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 24px;
            color: #8c5c3b;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .upload-form {
            background: #fffaf5;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e2c9b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 16px;
                color: #7a513c;
                margin-bottom: 10px;
            }

            .form-group input[type="file"] {
                width: 100%;
                padding: 15px;
                border: 1px solid #e2c9b8;
                border-radius: 6px;
                background: #fff;
            }

            .form-group input[type="text"] {
                width: 100%;
                height: 48px;
                padding: 0 16px;
                border: 1px solid #e2c9b8;
                border-radius: 6px;
                background: #fff;
                font-size: 16px;
                color: #5a3c2c;
            }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .action-btn {
            height: 48px;
            padding: 0 24px;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-upload {
            background: #86987c;
            color: #fff;
        }

            .btn-upload:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        .btn-ai {
            background: #7a9cc6;
            color: #fff;
        }

            .btn-ai:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        /* 素材列表样式 */
        .material-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .material-item {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2c9b8;
            position: relative;
        }

            .material-item img {
                width: 100%;
                height: 160px;
                object-fit: cover;
            }

        .material-info {
            padding: 10px;
            font-size: 14px;
            color: #8c5c3b;
        }

        .material-del {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #c95a5a;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">传统色彩数字工坊 - 素材管理</div>
        <button class="header-btn" onclick="window.location.href='管理员界面.html'">返回登录界面</button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <a href="管理员主界面.html" class="nav-item">首页</a>
            <a href="管理员统计.html" class="nav-item">数据统计</a>
            <a href="管理员评论.html" class="nav-item">评论监管</a>
            <a href="管理员素材.html" class="nav-item active">素材管理</a>
            <a href="管理员AI评分.html" class="nav-item">AI评分</a>
            <a href="管理员排行榜.html" class="nav-item">热度排行</a>
        </div>

        <div class="content">
            <div class="content-card">
                <div class="content-title">染色素材上传</div>
                <div class="upload-form">
                    <div class="form-group">
                        <label>选择素材图片</label>
                        <input type="file" id="materialFile" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>素材名称</label>
                        <input type="text" id="materialName" placeholder="请输入素材名称">
                    </div>
                    <div class="form-group">
                        <label>素材分类</label>
                        <input type="text" id="materialCategory" placeholder="请输入素材分类">
                    </div>
                    <div class="form-actions">
                        <button class="action-btn btn-upload" onclick="uploadMaterial()">上传素材</button>
                        <button class="action-btn btn-ai" onclick="generateAIRecommendations()">AI推荐标签</button>
                    </div>
                </div>
            </div>

            <!-- 已上传素材列表 -->
            <div class="content-card">
                <div class="content-title">已上传素材（用户染色可见）</div>
                <div id="materialGrid" class="material-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // 上传素材（已修复：保存到用户可读取的公共素材库）
        function uploadMaterial() {
            var file = document.getElementById('materialFile').files[0];
            var name = document.getElementById('materialName').value;
            var category = document.getElementById('materialCategory').value;

            if (!file) {
                alert('请选择素材图片');
                return;
            }
            if (!name) {
                alert('请输入素材名称');
                return;
            }
            if (!category) {
                alert('请输入素材分类');
                return;
            }

            let reader = new FileReader();
            reader.onload = function (e) {
                let imgUrl = e.target.result;

                // 读取公共素材库
                let templates = JSON.parse(localStorage.getItem('adminTemplates') || '[]');

                // 加入新素材
                templates.unshift({
                    id: Date.now(),
                    name: name,
                    category: category,
                    img: imgUrl
                });

                // 保存
                localStorage.setItem('adminTemplates', JSON.stringify(templates));

                alert('素材上传成功！用户已可在染色工坊使用');

                // 清空表单
                document.getElementById('materialFile').value = '';
                document.getElementById('materialName').value = '';
                document.getElementById('materialCategory').value = '';

                // 刷新列表
                loadMaterialList();
            };
            reader.readAsDataURL(file);
        }

        // AI推荐标签
        function generateAIRecommendations() {
            var categories = ['自然风景', '传统纹样', '古典建筑', '花卉植物', '动物图案', '几何图形'];
            var randomCategory = categories[Math.floor(Math.random() * categories.length)];
            document.getElementById('materialCategory').value = randomCategory;
            alert('AI推荐标签生成成功！\n推荐分类：' + randomCategory);
        }

        // 加载素材列表
        function loadMaterialList() {
            let list = JSON.parse(localStorage.getItem('adminTemplates') || '[]');
            let grid = document.getElementById('materialGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#a87f61;">暂无素材</div>';
                return;
            }

            list.forEach(item => {
                let div = document.createElement('div');
                div.className = 'material-item';
                div.innerHTML = `
              <img src="${item.img}">
              <button class="material-del" onclick="delMaterial(${item.id})">删除</button>
              <div class="material-info">
                <div>${item.name}</div>
                <div style="font-size:12px;color:#a87f61;">${item.category}</div>
              </div>
            `;
                grid.appendChild(div);
            });
        }

        // 删除素材
        function delMaterial(id) {
            if (!confirm('确定删除该素材？用户将无法再使用！')) return;
            let list = JSON.parse(localStorage.getItem('adminTemplates') || '[]');
            list = list.filter(i => i.id !== id);
            localStorage.setItem('adminTemplates', JSON.stringify(list));
            loadMaterialList();
        }

        // 页面加载时显示素材列表
        window.onload = loadMaterialList;
    </script>
    <script src="ai-chat.js"></script>
</body>
</html>
